version: 2

project_name: kov

before:
  hooks:
    - go mod tidy

builds:
  - id: kov
    main: ./cmd/kov
    binary: kov
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'

release:
  github:
    owner: up1512001
    name: kov
  draft: false
  prerelease: auto
  name_template: "{{.Tag}}"

nfpms:
  - id: kov
    package_name: kov
    homepage: "https://trykov.dev"
    description: "Indestructible AI coding in your terminal"
    maintainer: "Utsav <hello@trykov.dev>"
    license: MIT
    formats:
      - deb
      - rpm

# Homebrew tap (macOS / Linux)
# Requires: PAT with repo scope stored as HOMEBREW_TAP_TOKEN secret
brews:
  - name: kov
    repository:
      owner: up1512001
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://trykov.dev"
    description: "Indestructible AI coding in your terminal"
    license: MIT
    dependencies:
      - name: git
    install: |
      bin.install "kov"
    test: |
      system "#{bin}/kov", "version"

