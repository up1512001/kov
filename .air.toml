root = "."
tmp_dir = "tmp"

[build]
  bin = "./bin/kov"
  cmd = "go build -o ./bin/kov ./cmd/kov"
  delay = 500
  exclude_dir = ["tmp", "bin", "vendor", "node_modules", ".git"]
  exclude_file = []
  exclude_regex = ["_test\\.go$", "_templ\\.go$"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "sql"]
  include_file = []
  kill_delay = "2s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
